name: Vault exact-SHA package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 074a307d31b843b0ce93a2fd80de1c9ea3f1b96a
          submodules: recursive
      - name: Read repository runtime pins
        id: runtimes
        run: |
          node -e 'const fs = require("fs"); const p = require("./package.json"); for (const r of p.devEngines.runtime) fs.appendFileSync(process.env.GITHUB_OUTPUT, r.name + "=" + r.version + "\n");'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtimes.outputs.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtimes.outputs.bun }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: Add hosted runner swap for declaration build
        run: |
          sudo fallocate -l 8G /swapfile-vault
          sudo chmod 600 /swapfile-vault
          sudo mkswap /swapfile-vault
          sudo swapon /swapfile-vault
          free -h
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter alchemy... run build:package
      - name: Pack and record provenance
        shell: bash
        run: |
          mkdir -p /tmp/vault-pack
          pnpm --dir packages/alchemy pack --pack-destination /tmp/vault-pack
          mv /tmp/vault-pack/alchemy-*.tgz /tmp/vault-pack/alchemy-074a307d.tgz
          cd /tmp/vault-pack
          sha512sum alchemy-074a307d.tgz > alchemy-074a307d.tgz.sha512
          printf 'source_commit=%s\nrun_url=%s\nrunner=%s\nrunner_os=%s\nrunner_arch=%s\n' '074a307d31b843b0ce93a2fd80de1c9ea3f1b96a' '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" > provenance.txt
          node --version >> provenance.txt
          pnpm --version >> provenance.txt
          bun --version >> provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alchemy-074a307d
          path: /tmp/vault-pack/
          if-no-files-found: error
          retention-days: 14
